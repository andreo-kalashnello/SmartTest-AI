services:
    postgres:
        image: postgres:16-alpine
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'
        environment:
            POSTGRES_USER: smarttest
            POSTGRES_PASSWORD: smarttest
            POSTGRES_DB: smarttest
        ports:
            - '127.0.0.1:5433:5432'
        volumes:
            - smarttest_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U smarttest -d smarttest']
            interval: 5s
            timeout: 5s
            retries: 10
    redis:
        image: redis:7-alpine
        logging:
            driver: 'json-file'
            options:
                max-size: '5m'
                max-file: '2'
        ports:
            - '127.0.0.1:6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10
    prometheus:
        image: prom/prometheus:v2.55.1
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '2'
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=6h'
            - '--storage.tsdb.retention.size=128MB'
            - '--web.enable-lifecycle'
        ports:
            - '127.0.0.1:9090:9090'
        volumes:
            - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - smarttest_prometheus_data:/prometheus
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            - postgres
            - redis
    grafana:
        image: grafana/grafana:11.3.1
        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '2'
        ports:
            - '127.0.0.1:3001:3000'
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: smarttest
            GF_USERS_ALLOW_SIGN_UP: 'false'
            GF_ANALYTICS_REPORTING_ENABLED: 'false'
            GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
            GF_LOG_LEVEL: warn
        volumes:
            - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
            - smarttest_grafana_data:/var/lib/grafana
        depends_on:
            - prometheus
volumes:
    smarttest_postgres_data:
    smarttest_prometheus_data:
    smarttest_grafana_data:
